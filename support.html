      <p>Open Cueit and go to <strong>Settings -> Ideas & Feedback</strong> to send feedback directly.</p>

      <h2>Email Support</h2>
      <p><a href="mailto:mycueitapp@gmail.com">mycueitapp@gmail.com</a></p>

      <ul>

        <li>What you expected vs. what happened</li>
        <li>Steps to reproduce the issue</li>
      </ul>
